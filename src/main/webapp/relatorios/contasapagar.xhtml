<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:jsf="http://xmlns.jcp.org/jsf"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head/>

<ui:composition template="/resources/template/aceadmin.xhtml">

	<ui:define name="navegacao">
		<li class="active">Relatório de Contas a Pagar</li>
	</ui:define>
	
	<ui:define name="titulo">
		<i class="ace-icon fa fa-print smaller-90"></i>
		Relatório de Contas a Pagar
	</ui:define>
	
	<ui:define name="subtitulo">
		<span>Relatório com a programação de pagamentos</span> 
	</ui:define>
	

	<ui:define name="conteudo">
		
		<div class="ui-g">	
			<div class="ui-g-12">

				<div class="col-sm-3"></div>
				<div class="col-sm-6 ">
					<div class="widget-box">
						<div class="widget-header">
							<h5 class="widget-title">Seleção</h5>
						</div>

						<h:form id="form" prependId="false">
							<div class="widget-body">
								<div class="widget-main">
								
										<div class="row">
											<div class="col-sm-6">
												<div class="form-group">
													<label class="control-label" jsf:for="dataInicial">Data Inicial</label>
													<div class="input-group">
														<input type="date" class="form-control" 
															jsf:id="dataInicial"
															jsf:binding="#{dataInicial}" 
															jsf:value="#{relatorioPagamentosBean.filtro.dataInicial}">
															<f:convertDateTime pattern="yyyy-MM-dd"/>
														</input>
														<span class="input-group-addon">
															<i class="fa fa-calendar bigger-110"></i>
														</span>
													</div>
												</div>
											</div>
											<div class="col-sm-6">
												<div class="form-group">
													<label class="control-label" jsf:for="dataFinal">Data Final</label>
													<div class="input-group">
														<input type="date" class="form-control" 
															jsf:id="dataFinal"
															jsf:binding="#{dataFinal}" 
															jsf:value="#{relatorioPagamentosBean.filtro.dataFinal}">
															<f:convertDateTime pattern="yyyy-MM-dd"/>
														</input> 
														<span class="input-group-addon">
															<i class="fa fa-calendar bigger-110"></i>
														</span>
													</div>
												</div>
											</div>								
										</div>
										
										<div class="row">
											<div class="col-sm-12">
												<div class="form-group">
													<label class="control-label" jsf:for="setor">Setor</label>
													<p:selectCheckboxMenu value="#{relatorioPagamentosBean.filtro.setores}" id="setor" converter="omnifaces.SelectItemsIndexConverter" label="Todos" updateLabel="true"
														filter="true" filterMatchMode="contains" style="width: 100%;">
														<f:selectItems var="setor" value="#{relatorioPagamentosBean.setores}"
															itemLabel="#{setor.descricao}" itemValue="#{setor}"/>
													</p:selectCheckboxMenu>
												</div>
											</div>
										</div>

										<div class="row">
											<div class="col-sm-12">
												<div class="form-group">
													<label class="control-label" jsf:for="conta">Conta</label>
													<p:selectCheckboxMenu value="#{relatorioPagamentosBean.filtro.contas}" id="conta" converter="omnifaces.SelectItemsIndexConverter" label="Todos" updateLabel="true"
														filter="true" filterMatchMode="contains" style="width: 100%;">
														<f:selectItems var="conta" value="#{relatorioPagamentosBean.contas}"
															itemLabel="#{conta.descricao}" itemValue="#{conta}"/>
													</p:selectCheckboxMenu>
												</div>
											</div>
										</div>
									
										<div class="row">
											<div class="col-sm-12">
												<div class="form-group">
													<label class="control-label" jsf:for="fornecedor">Fornecedor</label>
													<p:selectCheckboxMenu value="#{relatorioPagamentosBean.filtro.fornecedores}" id="fornecedor" converter="omnifaces.SelectItemsIndexConverter" label="Todos" updateLabel="true"
														filter="true" filterMatchMode="contains" style="width: 100%;">
														<f:selectItems var="fornecedor" value="#{relatorioPagamentosBean.fornecedores}"
															itemLabel="#{fornecedor.nomeFantasia}" itemValue="#{fornecedor}"/>
													</p:selectCheckboxMenu>
												</div>
											</div>
										</div>								
								</div>
								
								<div class="widget-toolbox padding-8 clearfix">
									<button class="btn btn-xs btn-info pull-left" type="button" 
										jsf:outcome="/index.xhtml"
										jsf:id="btnDashboard">
										<i class="ace-icon fa fa-arrow-left"></i>
										<span class="bigger-110">Dashborad</span>
									</button>
								
									<!-- Valida por ajax; sem registros mostra a mensagem aqui, senão aciona o btnGerarPdf (PDF em nova aba) -->
									<button class="btn btn-xs btn-success pull-right" type="button"
										jsf:id="btnImprimir"
										jsf:action="#{relatorioPagamentosBean.validarRelatorioContasAPagar()}">
										<span class="bigger-110">Gerar Relatório</span>
										<i class="ace-icon fa fa-arrow-right icon-on-right"></i>
										<f:ajax execute="@form" render="@none"/>
									</button>

									<button type="submit" style="display: none;"
										jsf:id="btnGerarPdf"
										jsf:onclick="this.form.target='_blank'"
										jsf:action="#{relatorioPagamentosBean.gerarRelatorioContasAPagar()}"/>

									<!-- Volta os filtros ao padrão: mês atual e nenhum setor/conta/fornecedor (o mesmo de quando a tela abre) -->
									<button class="btn btn-xs btn-warning pull-right" type="button" style="margin-right: 5px;"
										jsf:id="btnLimpar"
										jsf:action="#{relatorioPagamentosBean.limparFiltros()}">
										<i class="ace-icon fa fa-eraser"></i>
										<span class="bigger-110">Limpar Filtros</span>
										<f:ajax execute="@this" render="@form"/>
									</button>

								</div>
															
							</div>
						</h:form>
						
					</div>
				</div>
				<div class="col-sm-3"></div>

			</div>
			
		</div>


	</ui:define>

	<ui:define name="pagina">Setores</ui:define>

	<ui:define name="scripts">

	</ui:define>
	
</ui:composition>

</html>
